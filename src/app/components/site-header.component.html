<header class="site-header">
  <div class="header-inner shell">
    <a class="brand" routerLink="/" aria-label="Morrow Studio home" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 42 42" fill="none"><path d="M8 29V12h4v2.9c1.3-2.1 3.2-3.2 5.7-3.2 2.7 0 4.6 1.1 5.7 3.4 1.4-2.3 3.5-3.4 6.3-3.4 4.4 0 7 3 7 7.8V29h-4.2v-10c0-2.9-1.3-4.6-3.8-4.6-2.6 0-4.3 2-4.3 4.9V29h-4.2v-10c0-2.9-1.3-4.6-3.8-4.6-2.6 0-4.3 2-4.3 4.9V29z" fill="currentColor"/><circle cx="34" cy="8" r="2" fill="#B7654D"/></svg>
      </span>
      <span class="brand-copy"><strong>Morrow</strong><small>INVITATION STUDIO</small></span>
    </a>

    <a class="button button--primary header-quick-cta" routerLink="/start" (click)="closeMenu()">Start an invite <span aria-hidden="true">↗</span></a>
    <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">
      <span></span><span></span>
    </button>

    <nav class="main-nav" [class.main-nav--open]="menuOpen" aria-label="Main navigation">
      <a routerLink="/explore" (click)="closeMenu()">Explore</a>
      <a routerLink="/our-work/wedding-os" (click)="closeMenu()">Our work</a>
      <a routerLink="/how-it-works" (click)="closeMenu()">How it works</a>
      <a routerLink="/packages" (click)="closeMenu()">Packages</a>
      <a class="nav-cta" routerLink="/start" (click)="closeMenu()">Start an invitation <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
