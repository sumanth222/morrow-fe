<div
  class="invite-art"
  [class.invite-art--large]="large"
  [class.invite-art--midnight]="palette.name === 'Midnight'"
  [style.--art-paper]="palette.paper"
  [style.--art-ink]="palette.ink"
  [style.--art-accent]="palette.accent"
  [style.--art-wash]="palette.wash"
  [style.--art-line]="palette.line"
>
  <div class="art-frame"></div>
  <div class="art-topline"><span>{{ invitation.label }}</span><span>№ {{ invitation.index }}</span></div>
  <div class="art-botanical art-botanical--left" aria-hidden="true">
    <svg viewBox="0 0 140 180" fill="none"><path d="M7 169C33 129 48 84 57 11" stroke="var(--art-accent)" stroke-width="1.2"/><path d="M27 133C5 127 3 110 7 96C24 100 33 113 27 133Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M37 105C18 92 23 76 31 66C47 77 49 91 37 105Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M46 73C32 55 43 40 54 34C65 50 61 64 46 73Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M52 48C43 28 58 17 71 14C77 31 67 43 52 48Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M30 128C48 124 59 113 63 99C44 100 33 110 30 128Z" fill="var(--art-paper)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M42 91C62 91 73 79 76 65C55 67 45 77 42 91Z" fill="var(--art-paper)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M51 61C69 59 81 46 81 33C63 36 54 46 51 61Z" fill="var(--art-paper)" stroke="var(--art-accent)" stroke-width=".8"/><circle cx="80" cy="131" r="11" stroke="var(--art-accent)" stroke-width=".8"/><circle cx="80" cy="131" r="5" fill="var(--art-wash)"/></svg>
  </div>
  <div class="art-botanical art-botanical--right" aria-hidden="true">
    <svg viewBox="0 0 140 180" fill="none"><path d="M129 169C103 129 88 84 79 11" stroke="var(--art-accent)" stroke-width="1.2"/><path d="M109 133C131 127 133 110 129 96C112 100 103 113 109 133Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M99 105C118 92 113 76 105 66C89 77 87 91 99 105Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M90 73C104 55 93 40 82 34C71 50 75 64 90 73Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M84 48C93 28 78 17 65 14C59 31 69 43 84 48Z" fill="var(--art-wash)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M106 128C88 124 77 113 73 99C92 100 103 110 106 128Z" fill="var(--art-paper)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M94 91C74 91 63 79 60 65C81 67 91 77 94 91Z" fill="var(--art-paper)" stroke="var(--art-accent)" stroke-width=".8"/><path d="M85 61C67 59 55 46 55 33C73 36 82 46 85 61Z" fill="var(--art-paper)" stroke="var(--art-accent)" stroke-width=".8"/><circle cx="56" cy="131" r="11" stroke="var(--art-accent)" stroke-width=".8"/><circle cx="56" cy="131" r="5" fill="var(--art-wash)"/></svg>
  </div>
  <div class="art-center">
    <span class="art-kicker">{{ invitation.artKicker }}</span>
    <span class="art-star" aria-hidden="true">✳</span>
    <h3>{{ displayTitle }}</h3>
    <span class="art-rule"><i></i></span>
    <p>{{ invitation.artSubtitle }}</p>
    <span class="art-date">{{ displayDate }}</span>
  </div>
  <div class="art-bottomline"><span>AN INVITATION TO GATHER</span><span>MORROW STUDIO</span></div>
  <span class="art-orbit art-orbit--one" aria-hidden="true"></span><span class="art-orbit art-orbit--two" aria-hidden="true"></span>
</div>
